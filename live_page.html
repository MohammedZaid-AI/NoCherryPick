<!doctype html>
<meta charset="utf-8"><title>Reconciliation — live</title>
<style>
 :root{--bg:#0e1116;--fg:#e6e9ef;--dim:#8b94a7;--faint:#5a6376;--line:#222836;
       --card:#151a23;--ok:#35d07f;--warn:#f5b942;--bad:#ff5d5d;--blue:#5aa9ff}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden;height:100vh;
      display:flex;flex-direction:column;
      font:12.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
 header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;flex:0 0 auto;
        padding:9px 16px;border-bottom:1px solid var(--line)}
 h1{font-size:13px;margin:0;letter-spacing:.04em;white-space:nowrap}
 .clock{color:var(--blue)}
 .btns{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
 button{background:#1b2230;color:var(--fg);border:1px solid var(--line);border-radius:4px;
        padding:5px 9px;font:inherit;font-size:11px;cursor:pointer}
 button:hover{background:#26304180;border-color:#3a465c}
 button.on{background:#1d3a2a;border-color:var(--ok);color:var(--ok)}
 .sep{width:1px;height:20px;background:var(--line)}
 .strip{display:flex;gap:22px;padding:8px 16px;border-bottom:1px solid var(--line);
        overflow-x:auto;flex:0 0 auto}
 .c b{display:block;font-size:17px;font-weight:600;line-height:1.2}
 .c span{color:var(--faint);font-size:9.5px;text-transform:uppercase;letter-spacing:.09em}
 /* min-height:0 all the way down, or a grid/flex item grows to fit its content
    instead of constraining it -- which is why .scroll never got a scrollbar */
 main{display:grid;grid-template-columns:1fr 1.5fr 1fr;flex:1 1 auto;min-height:0}
 section{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;
         border-right:1px solid var(--line)}
 section:last-child{border-right:0}
 h2{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.11em;
    margin:0;padding:9px 12px 7px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between}
 .scroll{overflow-y:auto;overflow-x:hidden;padding:8px 10px;flex:1 1 auto;min-height:0;
         overscroll-behavior:contain}
 .half{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
 .half+.half{border-top:1px solid var(--line)}
 .pill{position:absolute;right:14px;bottom:12px;z-index:5;display:none;cursor:pointer;
       background:#1d3a2a;border:1px solid var(--ok);color:var(--ok);border-radius:12px;
       padding:3px 11px;font-size:10.5px;letter-spacing:.05em;box-shadow:0 4px 14px #0008}
 .pill:hover{background:#25553b}
 .pill.show{display:block}

 .rec{padding:4px 8px;margin-bottom:3px;background:var(--card);border-radius:3px;
      border-left:2px solid #2b3446;white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis;animation:slide .28s ease-out}
 .rec.ok{border-left-color:var(--ok)}
 .rec.warn{border-left-color:var(--warn)}
 .rec.bad{border-left-color:var(--bad)}
 .rec.live{background:#1d2735}
 .rec .amt{float:right;color:var(--dim);padding-left:10px}
 .rec .m{color:var(--faint)}
 @keyframes slide{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
 @keyframes pulse{0%{background:#28405a}100%{background:var(--card)}}
 .pulse{animation:pulse 1.1s ease-out}

 .blk{margin-bottom:7px;animation:slide .22s ease-out}
 .ln{white-space:pre-wrap;word-break:break-word}
 .k-match{color:var(--ok)} .k-verify{color:var(--dim)} .k-flag{color:var(--bad)}
 .k-challenge{color:var(--warn)} .k-note{color:var(--blue)}
 .tag{display:inline-block;min-width:74px;color:var(--faint)}
 .ex{font-style:italic;color:#9fb4d0;padding-left:76px;margin-top:2px}
 .ex .src{font-style:normal;color:var(--faint);font-size:10px}

 .exc{padding:5px 8px;margin-bottom:3px;background:var(--card);border-radius:3px;
      border-left:2px solid var(--bad);cursor:pointer;animation:slide .25s ease-out}
 .exc.soft{border-left-color:var(--warn)} .exc.info{border-left-color:var(--faint)}
 .exc:hover{background:#1c222d}
 .exc .top{display:flex;justify-content:space-between;gap:8px}
 .exc .meta{color:var(--faint);font-size:10.5px}
 .exc .body{display:none;color:var(--dim);margin-top:5px;white-space:pre-wrap}
 .exc.open .body{display:block}
 .frozen{color:var(--warn)}
 .rzp{display:inline-block;background:#123047;color:#7cc4ff;border:1px solid #2b6a9e;
      border-radius:3px;padding:0 4px;margin-right:5px;font-size:9.5px;letter-spacing:.06em}
 .rec.rzp-row{border-left-color:#5aa9ff}
 #toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:9;
        background:#123047;border:1px solid #2b6a9e;color:#cfe6ff;border-radius:5px;
        padding:9px 15px;display:none;box-shadow:0 8px 26px #0009}
 ::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:#2b3446;border-radius:4px}
</style>

<header>
  <h1>RECONCILIATION — LIVE</h1>
  <span class="clock" id="vdate">—</span>
  <div class="btns">
    <button onclick="inject('lookalike')">Trigger Lookalike</button>
    <button onclick="inject('illegal-mdr')">Trigger Illegal MDR</button>
    <button onclick="inject('batch')">Trigger Batch Deposit</button>
    <button onclick="inject('late-refund')">Trigger Late Refund</button>
    <div class="sep"></div>
    <button onclick="setSpeed(0)" id="sp0">Pause</button>
    <button onclick="setSpeed(1)" id="sp1" class="on">1x</button>
    <button onclick="setSpeed(5)" id="sp5">5x</button>
    <button onclick="setSpeed(20)" id="sp20">20x</button>
    <div class="sep"></div>
    <button onclick="rzpFile.click()">Load Razorpay CSV</button>
    <button onclick="loadSample()">Load Sample</button>
    <input type="file" id="rzpFile" accept=".csv" style="display:none"
           onchange="uploadRzp(this)">
    <button onclick="location.href='/batch'">Batch report</button>
  </div>
</header>
<div id="toast"></div>

<div class="strip">
  <div class="c"><b id="cMatched" style="color:var(--ok)">0</b><span>matched</span></div>
  <div class="c"><b id="cDemoted" style="color:var(--warn)">0</b><span>demoted</span></div>
  <div class="c"><b id="cExc" style="color:var(--bad)">0</b><span>exceptions</span></div>
  <div class="c"><b id="cRisk" style="color:var(--bad)">₹0</b><span>money at risk</span></div>
  <div class="c"><b id="cFee">₹0</b><span>fee leakage</span></div>
  <div class="c"><b id="cOrders">0</b><span>orders</span></div>
  <div class="c"><b id="cSetts">0</b><span>bank lines</span></div>
  <div class="c"><b id="cEng">—</b><span>engine time / tick</span></div>
</div>

<main>
  <section>
    <h2><span>Merchant — live orders</span><span id="mCount"></span></h2>
    <div class="scroll" id="merchant"></div>
  </section>

  <section>
    <h2><span>Agent — reasoning</span><span id="frozen"></span></h2>
    <div class="scroll" id="agent"></div>
  </section>

  <section>
    <div class="half">
      <h2><span>Bank — settlements arriving</span><span id="bCount"></span></h2>
      <div class="scroll" id="bank"></div>
    </div>
    <div class="half">
      <h2><span>Exceptions — ranked by exposure</span><span id="eCount"></span></h2>
      <div class="scroll" id="excs"></div>
    </div>
  </section>
</main>

<script>
const money = p => '₹' + (p/100).toLocaleString('en-IN',{maximumFractionDigits:2});
const CAP = 140;                     // keep the DOM from growing without bound

function el(tag, cls, html){ const d=document.createElement(tag); if(cls)d.className=cls;
  if(html!==undefined)d.innerHTML=html; return d; }

/* ---- feed scrolling ----------------------------------------------------
   These feeds are newest-FIRST: new rows are inserted at the top, so "live"
   means scrollTop 0, not the bottom. Stick there while the reader is at the
   newest end; the moment they scroll away (or hover), stop moving the view and
   compensate for the height each new row adds, so the line they are reading
   stays exactly where it is instead of being shoved down.            */
const STICK_PX = 50;

function isPinned(host){ return !host._hover && host.scrollTop <= STICK_PX; }

function prepend(host, node, cap=CAP){
  const stuck = isPinned(host);
  const before = host.scrollHeight;
  host.insertBefore(node, host.firstChild);
  while (host.children.length > cap) host.removeChild(host.lastChild);
  if (stuck) { host.scrollTop = 0; return; }
  host.scrollTop += host.scrollHeight - before;   // hold the reader's position
  if (host._pill){
    host._pending = (host._pending || 0) + 1;
    host._pill.textContent = '↑ ' + host._pending + ' new';
    host._pill.classList.add('show');
  }
}

function clearPill(host){
  host._pending = 0;
  if (host._pill) host._pill.classList.remove('show');
}

function initFeed(id, freezeLabel){
  const host = document.getElementById(id);
  const pill = el('div','pill','↑ new');
  pill.onclick = ()=>{ host.scrollTop = 0; clearPill(host); };
  host.parentElement.appendChild(pill);
  host._pill = pill;
  host.addEventListener('scroll', ()=>{ if (isPinned(host)) clearPill(host); });
  host.addEventListener('mouseenter', ()=>{
    host._hover = true;
    if (freezeLabel) { freezeLabel.textContent = 'paused — reading'; freezeLabel.className = 'frozen'; }
  });
  host.addEventListener('mouseleave', ()=>{
    host._hover = false;
    if (freezeLabel) freezeLabel.textContent = '';
    if (isPinned(host)) { host.scrollTop = 0; clearPill(host); }
  });
  return host;
}
const esc = s => String(s).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* ---- the three live feeds --------------------------------------------- */
const agent = initFeed('agent', document.getElementById('frozen'));
initFeed('merchant');
initFeed('bank');

function say(lines){
  const blk = el('div','blk');
  for (const [cls, tag, text] of lines)
    blk.appendChild(el('div','ln '+cls, `<span class=tag>${tag}</span>${text}`));
  prepend(agent, blk);   // never buffered -- scroll anchoring keeps the view still
}

/* ---- record rows ------------------------------------------------------- */
const rows = {};                      // id -> DOM node, so matches can recolour
function orderRow(o){
  const n = el('div','rec live',
    `${o.id} <span class=m>${o.method}${o.status==='refunded'?' · REFUND':''}</span>`+
    `<span class=amt>${money(o.gross)}</span>`);
  rows[o.id] = n; prepend(document.getElementById('merchant'), n);
  setTimeout(()=>n.classList.remove('live'), 900);
}
function settRow(s){
  const label = s.type==='batch' ? 'NET BATCH' : (s.type==='refund' ? 'REFUND' : s.method);
  const n = el('div','rec live',
    `${s.id} <span class=m>${label}${s.ref?' · '+s.ref:' · no ref'}</span>`+
    `<span class=amt>${money(s.type==='refund'?s.gross:s.net)}</span>`);
  rows[s.id] = n; prepend(document.getElementById('bank'), n);
  setTimeout(()=>n.classList.remove('live'), 900);
}
function mark(id, cls){ const n = rows[id]; if(n){ n.classList.remove('ok','warn','bad'); n.classList.add(cls, 'pulse'); setTimeout(()=>n.classList.remove('pulse'),1200);} }

/* ---- exceptions -------------------------------------------------------- */
function renderExceptions(items){
  const host = document.getElementById('excs');
  host.innerHTML = '';
  for (const e of items){
    const cls = e.amount===0 ? 'exc info' : (e.code.startsWith('LATE') ? 'exc soft' : 'exc');
    const n = el('div', cls,
      `<div class=top><span>${e.code}</span><span>${money(e.amount)}</span></div>`+
      `<div class=meta>${e.record} · ${e.age_days}d at risk</div>`+
      `<div class=body><b>why</b>\n${esc(e.explanation)}\n\n<b>action</b>\n${esc(e.action)}</div>`);
    n.onclick = ()=>n.classList.toggle('open');
    host.appendChild(n);
  }
  document.getElementById('eCount').textContent = items.length + ' open';
}

/* ---- event handling ---------------------------------------------------- */
function onMatch(m){
  const who = m.orders.length>1 ? `${m.orders.length} orders` : m.orders[0];
  const amt = m.gross!==undefined ? `  amount=${money(m.gross)}` : '';
  say([['k-match','MATCH', `${who} → ${m.settlement}${amt}  conf=${m.confidence.toFixed(2)}  (${m.pass_name})`]]);
  // the signals ARE engine.challenge()'s output -- this is the self-verification
  const lines = m.signals.map(s => ['k-verify','VERIFY', esc(s)]);
  if (!m.confident)
    lines.push(['k-challenge','CHALLENGE',
      `score ${m.confidence.toFixed(2)} < threshold 0.70 — demoting to LOW_CONFIDENCE_MATCH`]);
  say(lines);
  const cls = m.confident ? 'ok' : 'bad';
  m.orders.forEach(o=>mark(o, cls)); mark(m.settlement, cls);
}

function apply(ev){
  switch(ev.kind){
    case 'snapshot':
      ev.orders.slice(-CAP).forEach(orderRow);
      ev.settlements.slice(-CAP).forEach(settRow);
      ev.matches.forEach(m=>{ const c = m.confident?'ok':'bad';
        m.orders.forEach(o=>mark(o,c)); mark(m.settlement,c); });
      renderExceptions(ev.exceptions); stats(ev.stats); break;
    case 'order':      orderRow(ev); break;
    case 'settlement': settRow(ev);  break;
    case 'match':      onMatch(ev);  break;
    case 'flag':
      say([['k-flag','FLAG',
        `${ev.settlement}  reason=${ev.code}  ${esc(ev.detail)}  overcharge=${money(ev.overcharge)}`]]);
      mark(ev.settlement,'warn'); break;
    case 'explain': {
      const blk = el('div','blk');
      blk.appendChild(el('div','ex',
        `“${esc(ev.text)}” <span class=src>— ${ev.source==='llm'?'LLM, past the number guard':'rules engine'}</span>`));
      prepend(agent, blk);
      break;
    }
    case 'exceptions': renderExceptions(ev.items); break;
    case 'stats':      stats(ev); break;

    /* ---- Razorpay-native events (additive; nothing above changes) ---- */
    case 'rzp_settlement': {
      const n = el('div','rec live rzp-row',
        `<span class=rzp>RZP</span>${ev.settlement_id} <span class=m>payout · ${ev.utr}</span>`+
        `<span class=amt>${money(ev.amount)}</span>`);
      prepend(document.getElementById('bank'), n);
      setTimeout(()=>n.classList.remove('live'), 900);
      say([['k-note','WEBHOOK',
        `${ev.type} ${ev.settlement_id} utr=${ev.utr} amount=${money(ev.amount)} `+
        `fees=${money(ev.fees)} tax=${money(ev.tax)} — payout initiated, funds land within ~3h`]]);
      break;
    }
    case 'rzp_line': {
      const n = el('div','rec rzp-row on',
        `<span class=rzp>RZP</span>${ev.id} <span class=m>${ev.type==='refund'?'REFUND':ev.method}</span>`+
        `<span class=amt>${money(ev.type==='refund'?ev.gross:ev.net)}</span>`);
      prepend(document.getElementById('bank'), n);
      break;
    }
    case 'rzp_import':
      toastMsg(`Loaded ${ev.payments} payments across ${ev.settlements} settlements `+
               `from Razorpay report — ${ev.matched}/${ev.payments} matched, `+
               `${ev.exceptions} exceptions, ${money(ev.leakage)} fee leakage`);
      say([['k-note','IMPORT',
        `Razorpay report: ${ev.payments} payments, ${ev.settlements} payouts `+
        `(${ev.utrs.join(', ')}), matched ${ev.matched}, engine ${ev.elapsed.toFixed(3)}s`]]);
      break;
    case 'rzp_exceptions':
      for (const e of ev.items)
        say([['k-flag','RZP-EXC', `${e.code}  ${e.record}  ${money(e.amount)} — ${esc(e.explanation)}`]]);
      break;
  }
}

function toastMsg(text){
  toast.textContent = text; toast.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(()=>toast.style.display='none', 6000);
}

// success toast comes from the rzp_import event, so both loaders share it
function ingestPost(url, opts, reading){
  toastMsg(reading);
  fetch(url, opts).then(r=>r.json()).then(r=>{
    if (!r.ok) toastMsg('Could not read that report: ' + r.detail);
  }).catch(()=>toastMsg('Load failed'));
}

function loadSample(){
  ingestPost('/upload/razorpay-sample', {method:'POST'},
             'Reading bundled Razorpay sample …');
}

function uploadRzp(input){
  const f = input.files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  ingestPost('/upload/razorpay-csv', {method:'POST',body:fd}, 'Reading ' + f.name + ' …');
  input.value = '';
}

function stats(s){
  cMatched.textContent = s.matched; cDemoted.textContent = s.demoted;
  cExc.textContent = s.exceptions;  cRisk.textContent = money(s.risk);
  cFee.textContent = money(s.fee_leak);
  cOrders.textContent = s.orders;   cSetts.textContent = s.settlements;
  cEng.textContent = s.engine_ms.toFixed(2)+'ms';
  vdate.textContent = 'virtual book date ' + s.vdate + (s.speed ? ` · ${s.speed}x` : ' · paused');
  document.getElementById('mCount').textContent = s.orders + ' seen';
  document.getElementById('bCount').textContent = s.settlements + ' arrived, ' + s.pending + ' in flight';
}

/* ---- controls ---------------------------------------------------------- */
function setSpeed(v){
  fetch('/speed',{method:'POST',headers:{'Content-Type':'application/json'},
                  body:JSON.stringify({speed:v})});
  for (const id of ['sp0','sp1','sp5','sp20']) document.getElementById(id).classList.remove('on');
  document.getElementById('sp'+v).classList.add('on');
}
function inject(name){
  fetch('/inject/'+name,{method:'POST'}).then(r=>r.json()).then(r=>
    say([['k-note','INJECT', `${name} — ${esc(r.detail)}`]]));
}

new EventSource('/stream').onmessage = e => apply(JSON.parse(e.data));
</script>
